[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supermimic-chord-study"
version = "0.1.0"
description = "Auditable reference and contact-dynamics evaluation for the Wuji Hand2 study"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<2.5", "torch>=2.7"]

[project.scripts]
chord-study = "chord_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
